# Tonghopsuthpt-TQTH-I-
<!DOCTYPE html><html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thư viện hình ảnh</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f6fa;
    }
    header {
      background: #4a69bd;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }
    .container {
      display: flex;
    }
    .menu {
      width: 250px;
      background: white;
      padding: 10px;
      border-right: 1px solid #ddd;
      height: 100vh;
      overflow-y: auto;
    }
    .menu h3 {
      margin-top: 15px;
    }
    .menu button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 8px;
      border: none;
      background: #ecf0f1;
      cursor: pointer;
      border-radius: 6px;
    }
    .menu button:hover {
      background: #dcdde1;
    }
    .content {
      flex: 1;
      padding: 20px;
    }
    .images {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .images img {
      width: 150px;
      border-radius: 10px;
    }
    .add-btn {
      margin-top: 15px;
      padding: 10px;
      background: #4a69bd;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body><header>📁 Thư viện hình ảnh của bạn</header><div class="container">
  <div class="menu">
    <h3>I. Phần 1</h3>
    <button onclick="loadSection('section1')">Bài 1</button>
    <button onclick="loadSection('section2')">Bài 2</button><h3>II. Phần 2</h3>
<button onclick="loadSection('section3')">Bài 3</button>
<button onclick="loadSection('section4')">Bài 4</button>

  </div>  <div class="content">
    <h2 id="title">Chọn mục để xem</h2>
    <div class="images" id="imageContainer"></div>
    <input type="file" id="fileInput" style="display:none" accept="image/*">
    <button class="add-btn" onclick="document.getElementById('fileInput').click()">+ Thêm ảnh</button>
  </div>
</div><script>
  let data = {
    section1: [],
    section2: [],
    section3: [],
    section4: []
  };

  let currentSection = null;

  function loadSection(section) {
    currentSection = section;
    document.getElementById('title').innerText = section;
    renderImages();
  }

  function renderImages() {
    let container = document.getElementById('imageContainer');
    container.innerHTML = '';

    if (!currentSection) return;

    data[currentSection].forEach(src => {
      let img = document.createElement('img');
      img.src = src;
      container.appendChild(img);
    });
  }

  document.getElementById('fileInput').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file || !currentSection) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      data[currentSection].push(e.target.result);
      renderImages();
    };
    reader.readAsDataURL(file);
  });
</script></body>
</html>
